  <!-- Contact Us Section -->
  <section class="contact-section" id="contact">
    <h2>Contact Us</h2>
    <div class="contact-container">
      <div class="contact-form">
        <form action="#" method="post" onsubmit="return validateForm()">
          <input type="text" id="name" name="name" placeholder="Your Name" required>
          <input type="email" id="email" name="email" placeholder="Your Email" required>
          <input type="text" id="subject" name="subject" placeholder="Subject" required>
          <textarea id="message" name="message" rows="5" placeholder="Your Message" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>
      <div class="map-container">
        <iframe 
          width="100%" height="400" 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345093687!2d144.95373531590486!3d-37.81627974202105!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d43f3f4e1c1%3A0x2f2d9b9b0b5b3b1!2sMelbourne%20Central!5e0!3m2!1sen!2sau!4v1633106904656!5m2!1sen!2sau" 
          allowfullscreen="" loading="lazy">
        </iframe>
      </div>
    </div>
