<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MedsureAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      height: 100vh;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-form {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 300px;
    }
    .form-control {
      margin-bottom: 15px;
    }
    .btn-primary {
      width: 100%;
    }
  </style>
</head>
<body>

<div class="login-form">
  <h2 class="text-center mb-4">MedsureAI Login</h2>
  <form id="loginForm">
    <input type="text" id="username" class="form-control" placeholder="Username" required>
    <input type="password" id="password" class="form-control" placeholder="Password" required>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <div id="message" class="mt-3 text-center"></div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    // Simple check (You can replace this with actual authentication)
    if(username === 'admin' && password === '1234') {
      document.getElementById('message').innerHTML = '<span class="text-success">Login successful!</span>';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    } else {
      document.getElementById('message').innerHTML = '<span class="text-danger">Invalid credentials, try again.</span>';
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
