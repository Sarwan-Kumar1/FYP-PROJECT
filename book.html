  <!-- Appointment Booking Form -->
  <div class="book-container">
    <div class="appointment-form">
        <h3 class="text-center mb-3">Book your appointment</h3>
        <p class="text-center text-muted">We will confirm your appointment within 2 hours</p>
        <form>
            <div class="row g-3">
                <div class="col-md-6">
                    <input type="text" class="form-control" placeholder="Name" required>
                </div>
                <div class="col-md-6">
                    <input type="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="col-md-6">
                    <input type="tel" class="form-control" placeholder="Phone" required>
                </div>
                <div class="col-md-6">
                    <select class="form-select" required>
                        <option selected disabled>Department</option>
                        <option>Cardiology</option>
                        <option>Neurology</option>
                        <option>Orthopedics</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <select class="form-select" required>
                        <option selected disabled>Doctor</option>
                        <option>Dr. Mazhar Ali</option>
                        <option>Dr. Asad Abbasi</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <input type="date" class="form-control" required>
                </div>
                <div class="col-12">
                    <textarea class="form-control" rows="4" placeholder="Write Your Message Here..." required></textarea>
                </div>
                <div class="col-12 text-center">
                    <button type="submit" class="btn btn-primary w-100">Book An Appointment</button>
                </div>
            </div>
        </form>
    </div>
  </div> <!-- FIXED: Closing the book-container div -->
