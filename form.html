      <select id="diseases" name="diseases[]" multiple>
        <option value="Kidney Stones">Kidney Stones</option>
        <option value="Liver Cirrhosis">Liver Cirrhosis</option>
        <option value="Hepatitis">Hepatitis</option>
        <option value="Kidney Failure">Kidney Failure</option>
        <option value="Fatty Liver">Fatty Liver</option>
      </select>

      <label for="report">Upload Your Medical Report:</label>
      <input type="file" id="report" name="report" accept="image/*, .pdf">

      <button type="submit">Submit</button>
    </form>
